[project]
name = "jobscout"
version = "0.1.0"
description = "Job aggregation and eligibility/relevance matching system"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobscout", "jobscout.fetchers"]
